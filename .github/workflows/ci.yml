name: Spring Boot CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wagle
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/wagle
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: ./gradlew build

      - name: Discord Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "username": "Wagle Server Bot",
            "embeds": [{
              "title": "Success! ✅",
              "description": "Spring Boot 빌드 성공",
              "fields": [
                {
                  "name": "Repository",
                  "value": "${{ github.repository }}",
                  "inline": true
                },
                {
                  "name": "Branch",
                  "value": "${{ github.ref_name }}",
                  "inline": true
                }
              ]
            }]
          }' \
          "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Discord Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "username": "Wagle Server Bot",
            "embeds": [{
              "title": "Failure ❌",
              "description": "Spring Boot 빌드 실패",
              "fields": [
                {
                  "name": "Repository",
                  "value": "${{ github.repository }}",
                  "inline": true
                },
                {
                  "name": "Branch",
                  "value": "${{ github.ref_name }}",
                  "inline": true
                }
              ]
            }]
          }' \
          "${{ secrets.DISCORD_WEBHOOK_URL }}"
